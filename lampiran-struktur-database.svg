<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 540" font-family="Arial, Helvetica, sans-serif">
  <style>
    .ent{fill:#ffffff;stroke:#274f5f;stroke-width:1.5;}
    .hdr{fill:#2e5c6e;}
    .htxt{fill:#ffffff;font-weight:bold;font-size:14px;}
    .f{fill:#1a1a1a;font-size:12.5px;}
    .pk{fill:#b06a2c;font-weight:bold;font-size:10.5px;}
    .fk{fill:#2b6cb0;font-weight:bold;font-size:10.5px;}
    .rel{stroke:#2b6cb0;stroke-width:1.6;fill:none;}
    .card{fill:#2b6cb0;font-size:12px;font-weight:bold;}
    .sep{stroke:#e0e6e9;stroke-width:1;}
  </style>

  <!-- ================= pegawai ================= -->
  <g>
    <rect class="ent" x="40" y="70" width="200" height="136" rx="4"/>
    <path class="hdr" d="M40 74 a4 4 0 0 1 4 -4 h192 a4 4 0 0 1 4 4 v22 h-200 z"/>
    <text class="htxt" x="52" y="90">pegawai</text>
    <line class="sep" x1="40" y1="122" x2="240" y2="122"/>
    <text class="f" x="52" y="118"><tspan class="pk">PK</tspan>  id</text>
    <text class="f" x="52" y="140">nip</text>
    <text class="f" x="52" y="160">nama</text>
    <text class="f" x="52" y="180">jabatan</text>
    <text class="f" x="52" y="200">unit_kerja</text>
  </g>

  <!-- ================= perjalanan_dinas (hub) ================= -->
  <g>
    <rect class="ent" x="360" y="55" width="210" height="156" rx="4"/>
    <path class="hdr" d="M360 59 a4 4 0 0 1 4 -4 h202 a4 4 0 0 1 4 4 v22 h-210 z"/>
    <text class="htxt" x="372" y="75">perjalanan_dinas</text>
    <line class="sep" x1="360" y1="107" x2="570" y2="107"/>
    <text class="f" x="372" y="103"><tspan class="pk">PK</tspan>  id</text>
    <text class="f" x="372" y="125"><tspan class="fk">FK</tspan>  pegawai_id</text>
    <text class="f" x="372" y="145">tujuan</text>
    <text class="f" x="372" y="165">tgl_berangkat</text>
    <text class="f" x="372" y="185">tgl_kembali</text>
    <text class="f" x="372" y="205">status</text>
  </g>

  <!-- ================= surat_perintah (SPD) ================= -->
  <g>
    <rect class="ent" x="690" y="70" width="200" height="136" rx="4"/>
    <path class="hdr" d="M690 74 a4 4 0 0 1 4 -4 h192 a4 4 0 0 1 4 4 v22 h-200 z"/>
    <text class="htxt" x="702" y="90">surat_perintah (SPD)</text>
    <line class="sep" x1="690" y1="122" x2="890" y2="122"/>
    <text class="f" x="702" y="118"><tspan class="pk">PK</tspan>  id</text>
    <text class="f" x="702" y="140"><tspan class="fk">FK</tspan>  perjalanan_id</text>
    <text class="f" x="702" y="160">no_spd</text>
    <text class="f" x="702" y="180">tgl_terbit</text>
    <text class="f" x="702" y="200">status_tte</text>
  </g>

  <!-- ================= rincian_biaya ================= -->
  <g>
    <rect class="ent" x="40" y="360" width="200" height="116" rx="4"/>
    <path class="hdr" d="M40 364 a4 4 0 0 1 4 -4 h192 a4 4 0 0 1 4 4 v22 h-200 z"/>
    <text class="htxt" x="52" y="380">rincian_biaya</text>
    <line class="sep" x1="40" y1="412" x2="240" y2="412"/>
    <text class="f" x="52" y="408"><tspan class="pk">PK</tspan>  id</text>
    <text class="f" x="52" y="430"><tspan class="fk">FK</tspan>  perjalanan_id</text>
    <text class="f" x="52" y="450">uraian</text>
    <text class="f" x="52" y="470">jumlah</text>
  </g>

  <!-- ================= riwayat_persetujuan ================= -->
  <g>
    <rect class="ent" x="360" y="360" width="210" height="136" rx="4"/>
    <path class="hdr" d="M360 364 a4 4 0 0 1 4 -4 h202 a4 4 0 0 1 4 4 v22 h-210 z"/>
    <text class="htxt" x="372" y="380">riwayat_persetujuan</text>
    <line class="sep" x1="360" y1="412" x2="570" y2="412"/>
    <text class="f" x="372" y="408"><tspan class="pk">PK</tspan>  id</text>
    <text class="f" x="372" y="430"><tspan class="fk">FK</tspan>  perjalanan_id</text>
    <text class="f" x="372" y="450">aktor</text>
    <text class="f" x="372" y="470">aksi</text>
    <text class="f" x="372" y="490">waktu</text>
  </g>

  <!-- ================= log_tte ================= -->
  <g>
    <rect class="ent" x="690" y="360" width="200" height="136" rx="4"/>
    <path class="hdr" d="M690 364 a4 4 0 0 1 4 -4 h192 a4 4 0 0 1 4 4 v22 h-200 z"/>
    <text class="htxt" x="702" y="380">log_tte</text>
    <line class="sep" x1="690" y1="412" x2="890" y2="412"/>
    <text class="f" x="702" y="408"><tspan class="pk">PK</tspan>  id</text>
    <text class="f" x="702" y="430"><tspan class="fk">FK</tspan>  spd_id</text>
    <text class="f" x="702" y="450">status</text>
    <text class="f" x="702" y="470">keterangan</text>
    <text class="f" x="702" y="490">waktu</text>
  </g>

  <!-- ================= relasi ================= -->
  <!-- pegawai 1 - N perjalanan -->
  <line class="rel" x1="240" y1="138" x2="360" y2="130"/>
  <text class="card" x="248" y="130">1</text>
  <text class="card" x="346" y="122">N</text>

  <!-- perjalanan 1 - 1 spd -->
  <line class="rel" x1="570" y1="132" x2="690" y2="138"/>
  <text class="card" x="578" y="124">1</text>
  <text class="card" x="678" y="130">1</text>

  <!-- perjalanan 1 - N rincian_biaya -->
  <polyline class="rel" points="400,211 400,320 140,320 140,360"/>
  <text class="card" x="406" y="228">1</text>
  <text class="card" x="148" y="352">N</text>

  <!-- perjalanan 1 - N riwayat -->
  <line class="rel" x1="490" y1="211" x2="490" y2="360"/>
  <text class="card" x="496" y="228">1</text>
  <text class="card" x="496" y="352">N</text>

  <!-- spd 1 - N log_tte -->
  <line class="rel" x1="790" y1="206" x2="790" y2="360"/>
  <text class="card" x="796" y="224">1</text>
  <text class="card" x="796" y="352">N</text>

  <!-- legenda -->
  <g font-size="11.5px">
    <rect x="600" y="512" width="14" height="12" fill="#fff" stroke="#274f5f"/>
    <text class="pk" x="626" y="522">PK</text><text class="f" x="648" y="522">= Primary Key</text>
    <text class="fk" x="748" y="522">FK</text><text class="f" x="770" y="522">= Foreign Key</text>
  </g>
</svg>
