name: Deploy Website SPPD Update to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/sppd-update

            echo "Pull latest code..."
            git pull origin main

            echo "Rebuild Docker..."
            docker compose down
            docker compose up -d --build

            echo "Waiting for app container to be ready..."
            sleep 5

            echo "Clearing caches..."
            docker exec sppd_update_app php artisan optimize:clear
            docker exec sppd_update_app php artisan optimize

            echo "Restarting queue worker..."
            docker exec sppd_update_app php artisan queue:restart

            echo "Verifying containers..."
            docker compose ps

            echo "Done!"
